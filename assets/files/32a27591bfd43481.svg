<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Awaitlab flask, redrawn from src/components/layout/logo.tsx. The logo's
       glyph is 30x34 with a tall neck; scaled into a 32x32 tile it would read as
       a smudge at 16px, so the body is widened and the neck shortened. Brand
       tokens are resolved to literals: a favicon is served standalone and never
       sees the stylesheet's custom properties. -->
  <rect width="32" height="32" rx="7" fill="#060c0a"/>
  <defs><clipPath id="glass"><path d="M13 6.5h6V13l6.6 11.1A2.4 2.4 0 0 1 23.5 28h-15a2.4 2.4 0 0 1-2.1-3.9L13 13V6.5Z"/></clipPath></defs>
  <!-- Flask silhouette: neck, shoulders, flared body. -->
  <path d="M13 6.5h6V13l6.6 11.1A2.4 2.4 0 0 1 23.5 28h-15a2.4 2.4 0 0 1-2.1-3.9L13 13V6.5Z"
        fill="#1ab285" fill-opacity="0.22"/>
  <!-- Liquid: the silhouette itself below the surface line, so it meets the
       walls exactly and never bleeds past the glass. -->
  <rect x="0" y="20.5" width="32" height="11.5" fill="#24dfa8" clip-path="url(#glass)"/>
  <path d="M13 6.5h6V13l6.6 11.1A2.4 2.4 0 0 1 23.5 28h-15a2.4 2.4 0 0 1-2.1-3.9L13 13V6.5Z"
        fill="none" stroke="#9df1d8" stroke-width="1.7" stroke-linejoin="round"/>
  <!-- Bubbles: two in the liquid, one rising through the neck. -->
  <circle cx="13.2" cy="24.2" r="1.5" fill="#caf7ea"/>
  <circle cx="18.4" cy="25.4" r="1.05" fill="#caf7ea" fill-opacity="0.8"/>
  <circle cx="16" cy="10.4" r="1.25" fill="#9df1d8" fill-opacity="0.9"/>
</svg>
